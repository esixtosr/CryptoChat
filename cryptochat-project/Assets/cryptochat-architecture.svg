<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">CryptoChat Architecture</title>
  <desc id="desc">Architecture diagram showing two CryptoChat peers communicating over encrypted TCP after X25519 key exchange, HKDF key derivation, AES-GCM encryption, and TOFU fingerprint verification.</desc>
  <defs>
    <style>
      .bg { fill: #020617; }
      .panel { fill: #111a2e; stroke: #007b8f; stroke-width: 2; }
      .panel-alt { fill: #07111f; stroke: #00f5c8; stroke-width: 2; }
      .card { fill: #17233b; stroke: #006f83; stroke-width: 2; }
      .crypto { fill: #063f3a; stroke: #00f5c8; stroke-width: 2; }
      .chip { fill: #10182a; stroke: #0b3042; stroke-width: 2; }
      .wire { stroke: #00f5c8; stroke-width: 4; fill: none; }
      .wire-muted { stroke: #7fa2bd; stroke-width: 3; fill: none; stroke-dasharray: 10 10; }
      .text { fill: #e8f1ff; font-family: Arial, Helvetica, sans-serif; }
      .muted { fill: #9fb0c8; font-family: Arial, Helvetica, sans-serif; }
      .accent { fill: #00f5c8; font-family: Arial, Helvetica, sans-serif; font-weight: 700; }
      .green { fill: #00b000; font-family: Arial, Helvetica, sans-serif; font-weight: 700; }
      .small { font-size: 22px; }
      .body { font-size: 25px; }
      .label { font-size: 28px; font-weight: 700; }
      .title { font-size: 52px; font-weight: 800; }
      .subtitle { font-size: 25px; font-weight: 700; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00f5c8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect class="bg" width="1600" height="950"/>

  <g transform="translate(90 62)">
    <path d="M40 0H1380C1402 0 1420 18 1420 40V790C1420 812 1402 830 1380 830H40C18 830 0 812 0 790V40C0 18 18 0 40 0Z" fill="#07111f" stroke="#0b3042" stroke-width="2" filter="url(#shadow)"/>
    <text class="text title" x="710" y="78" text-anchor="middle">CryptoChat Architecture</text>
    <text class="accent subtitle" x="710" y="116" text-anchor="middle">End-to-end encrypted peer-to-peer messaging prototype</text>

    <g transform="translate(70 165)">
      <rect class="panel" width="455" height="500" rx="18"/>
      <text class="text label" x="228" y="50" text-anchor="middle">Peer A</text>
      <text class="muted small" x="228" y="82" text-anchor="middle">Listener / Server</text>

      <rect class="card" x="55" y="125" width="345" height="82" rx="12"/>
      <text class="accent body" x="228" y="158" text-anchor="middle">PyQt6 GUI</text>
      <text class="muted small" x="228" y="188" text-anchor="middle">app.py</text>

      <rect class="card" x="55" y="245" width="345" height="82" rx="12"/>
      <text class="accent body" x="228" y="278" text-anchor="middle">Peer Transport</text>
      <text class="muted small" x="228" y="308" text-anchor="middle">peer.py</text>

      <rect class="crypto" x="55" y="365" width="345" height="92" rx="12"/>
      <text class="text body" x="228" y="398" text-anchor="middle">Crypto Session</text>
      <text class="muted small" x="228" y="429" text-anchor="middle">crypto_utils.py</text>

      <path class="wire-muted" d="M228 207V245"/>
      <path class="wire-muted" d="M228 327V365"/>
    </g>

    <g transform="translate(895 165)">
      <rect class="panel" width="455" height="500" rx="18"/>
      <text class="text label" x="228" y="50" text-anchor="middle">Peer B</text>
      <text class="muted small" x="228" y="82" text-anchor="middle">Connector / Client</text>

      <rect class="card" x="55" y="125" width="345" height="82" rx="12"/>
      <text class="accent body" x="228" y="158" text-anchor="middle">PyQt6 GUI</text>
      <text class="muted small" x="228" y="188" text-anchor="middle">app.py</text>

      <rect class="card" x="55" y="245" width="345" height="82" rx="12"/>
      <text class="accent body" x="228" y="278" text-anchor="middle">Peer Transport</text>
      <text class="muted small" x="228" y="308" text-anchor="middle">peer.py</text>

      <rect class="crypto" x="55" y="365" width="345" height="92" rx="12"/>
      <text class="text body" x="228" y="398" text-anchor="middle">Crypto Session</text>
      <text class="muted small" x="228" y="429" text-anchor="middle">crypto_utils.py</text>

      <path class="wire-muted" d="M228 207V245"/>
      <path class="wire-muted" d="M228 327V365"/>
    </g>

    <g transform="translate(580 292)">
      <rect class="panel-alt" width="260" height="248" rx="18"/>
      <text class="text label" x="130" y="46" text-anchor="middle">Secure Channel</text>

      <text class="accent small" x="130" y="91" text-anchor="middle">TCP 5556</text>
      <text class="muted small" x="130" y="122" text-anchor="middle">length-prefixed packets</text>

      <line class="wire" x1="-55" y1="94" x2="315" y2="94" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

      <text class="green small" x="130" y="172" text-anchor="middle">AES-256-GCM</text>
      <text class="muted small" x="130" y="203" text-anchor="middle">encrypted messages</text>
    </g>

    <g transform="translate(137 704)">
      <text class="accent small" x="573" y="0" text-anchor="middle">Security flow</text>

      <rect class="chip" x="0" y="28" width="260" height="74" rx="14"/>
      <text class="text small" x="130" y="60" text-anchor="middle">X25519</text>
      <text class="muted small" x="130" y="88" text-anchor="middle">key exchange</text>

      <rect class="chip" x="295" y="28" width="260" height="74" rx="14"/>
      <text class="text small" x="425" y="60" text-anchor="middle">HKDF-SHA256</text>
      <text class="muted small" x="425" y="88" text-anchor="middle">directional keys</text>

      <rect class="chip" x="590" y="28" width="260" height="74" rx="14"/>
      <text class="text small" x="720" y="60" text-anchor="middle">AES-256-GCM</text>
      <text class="muted small" x="720" y="88" text-anchor="middle">encrypted packets</text>

      <rect class="chip" x="885" y="28" width="260" height="74" rx="14"/>
      <text class="text small" x="1015" y="60" text-anchor="middle">TOFU + counters</text>
      <text class="muted small" x="1015" y="88" text-anchor="middle">trust and replay checks</text>
    </g>
  </g>
</svg>
